name: Build and Release QuickSnag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile macOS App
        run: |
          make clean
          make build
          zip -r -y QuickSnag-macOS-arm64.zip QuickSnag.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickSnag-macOS-arm64
          path: QuickSnag-macOS-arm64.zip

  build-windows:
    name: Build Windows (x64 Native)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows Standalone Executable (~65MB)
        run: |
          dotnet publish windows/QuickSnag.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o win-publish-standalone
          Compress-Archive -Path win-publish-standalone/* -DestinationPath QuickSnag-Windows-Standalone.zip
          Copy-Item QuickSnag-Windows-Standalone.zip -Destination QuickSnag-Windows-x64.zip

      - name: Publish Windows Lightweight Executable (~300KB)
        run: |
          dotnet publish windows/QuickSnag.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o win-publish-lightweight
          Compress-Archive -Path win-publish-lightweight/* -DestinationPath QuickSnag-Windows-Lightweight.zip

      - name: Upload Windows Standalone Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickSnag-Windows-Standalone
          path: QuickSnag-Windows-Standalone.zip

      - name: Upload Windows Lightweight Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickSnag-Windows-Lightweight
          path: QuickSnag-Windows-Lightweight.zip

      - name: Upload Windows Legacy Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickSnag-Windows-x64
          path: QuickSnag-Windows-x64.zip

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: QuickSnag-macOS-arm64

      - name: Download Windows Standalone Artifact
        uses: actions/download-artifact@v4
        with:
          name: QuickSnag-Windows-Standalone

      - name: Download Windows Lightweight Artifact
        uses: actions/download-artifact@v4
        with:
          name: QuickSnag-Windows-Lightweight

      - name: Download Windows Legacy Artifact
        uses: actions/download-artifact@v4
        with:
          name: QuickSnag-Windows-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: QuickSnag ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## QuickSnag ⚡
            100% Native Screenshot & Quick Annotation tool for macOS & Windows.

            ### 📥 Downloads:
            - 🍏 **macOS (Apple Silicon M1/M2/M3/M4)**: `QuickSnag-macOS-arm64.zip` (~1.1 MB)
            - 🪟 **Windows Standalone (Portable, No .NET install required)**: `QuickSnag-Windows-Standalone.zip` (~65 MB)
            - ⚡ **Windows Lightweight (Requires .NET 8 Desktop Runtime)**: `QuickSnag-Windows-Lightweight.zip` (~300 KB)

            ### ✨ Highlights:
            - **100% Native**: Ultra-lightweight, zero Electron, instant 0ms launch.
            - **Select, Move & Resize**: Interactive corner handles to resize/scale any annotation shape, drag to reposition, delete with Backspace, nudge with arrow keys, full Undo/Redo (`Cmd/Ctrl+Z`).
            - **1-Key Quick Flow**: Press `Enter` or `Cmd/Ctrl + C` to copy to clipboard & close popup.
            - **Tools**: Select/Resize (`🎯`), Arrow, Box, Oval, Auto Step Counter (1, 2, 3), Transparent Text, Pixelate Blur, Highlighter.
          files: |
            QuickSnag-macOS-arm64.zip
            QuickSnag-Windows-Standalone.zip
            QuickSnag-Windows-Lightweight.zip
            QuickSnag-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
